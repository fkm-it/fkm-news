# CI: setiap push & pull request — ujian (2 susunan muat) dan semakan statik.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main → deploy.yml (memanggil aliran ini dahulu)
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ujian & semakan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ujian (susunan muat abjad & terbalik)
        run: npm test
      - name: Semakan statik & imbasan rahsia
        run: npm run check
