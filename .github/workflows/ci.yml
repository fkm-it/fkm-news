# CI: setiap push & pull request — ujian (2 susunan muat) dan semakan statik.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main → deploy.yml (memanggil aliran ini dahulu)
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ujian & semakan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ujian (susunan muat abjad & terbalik)
        run: npm test
      - name: Semakan statik & imbasan rahsia
        run: npm run check
      - name: Binaan portal web (percubaan)
        run: node tools/build-web.js --api http://localhost:8080/__api --out .verify-web --data .e2e-tiada-data

  e2e:
    name: E2E portal (telefon 360px + desktop)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pasang Playwright
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Jalankan E2E
        run: |
          set -e
          node tools/build-web.js --api http://localhost:8080/__api --out .verify-web --data .e2e-tiada-data
          # Satu pelayan dev pada satu masa: hentikan yang lama dan tunggu
          # port bebas, supaya setiap mod diuji terhadap pelayannya sendiri.
          run_mode() {
            local flag="$1" log="$2"; shift 2
            node tools/dev-server.js --port 8080 $flag > "$log" 2>&1 &
            local pid=$!
            for i in $(seq 1 30); do curl -sf http://localhost:8080/ > /dev/null && break; sleep 1; done
            local rc=0
            env "$@" python tools/e2e.py || rc=$?
            kill $pid 2>/dev/null || true
            wait $pid 2>/dev/null || true
            for i in $(seq 1 20); do curl -sf http://localhost:8080/ > /dev/null || break; sleep 0.5; done
            return $rc
          }
          run_mode ""       dev-server.log        E2E_SHOTS=e2e-shots
          # Portal statik (F5): data/*.json dijana, bridge mesti membacanya dahulu
          run_mode --static dev-server-static.log E2E_STATIC=1 E2E_SHOTS=e2e-shots/static
          # Pembantu AI (F8) dengan Claude API tiruan
          run_mode --ai     dev-server-ai.log     E2E_AI=1 E2E_SHOTS=e2e-shots/ai
          # Notifikasi push (F11) dengan Firebase tiruan
          run_mode --push   dev-server-push.log   E2E_PUSH=1 E2E_SHOTS=e2e-shots/push
      - name: Simpan tangkapan skrin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: |
            e2e-shots
            dev-server*.log
          retention-days: 7
