# CI: setiap push & pull request — ujian (2 susunan muat) dan semakan statik.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main → deploy.yml (memanggil aliran ini dahulu)
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ujian & semakan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ujian (susunan muat abjad & terbalik)
        run: npm test
      - name: Semakan statik & imbasan rahsia
        run: npm run check
      - name: Binaan portal web (percubaan)
        run: node tools/build-web.js --api http://localhost:8080/__api --out .verify-web --data .e2e-tiada-data

  e2e:
    name: E2E portal (telefon 360px + desktop)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pasang Playwright
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Jalankan E2E
        run: |
          node tools/build-web.js --api http://localhost:8080/__api --out .verify-web --data .e2e-tiada-data
          node tools/dev-server.js --port 8080 > dev-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/ > /dev/null && break; sleep 1; done
          python tools/e2e.py
          # Portal statik (F5): data/*.json dijana, bridge mesti membacanya dahulu
          kill %1 || true
          node tools/dev-server.js --port 8080 --static > dev-server-static.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/data/bm/home.json > /dev/null && break; sleep 1; done
          E2E_STATIC=1 E2E_SHOTS=e2e-shots/static python tools/e2e.py
          # Pembantu AI (F8) dengan Claude API tiruan
          kill %2 || true
          node tools/dev-server.js --port 8080 --ai > dev-server-ai.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/ > /dev/null && break; sleep 1; done
          E2E_AI=1 E2E_SHOTS=e2e-shots/ai python tools/e2e.py
          # Notifikasi push (F11) dengan Firebase tiruan
          kill %3 || true
          node tools/dev-server.js --port 8080 --push > dev-server-push.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/ > /dev/null && break; sleep 1; done
          E2E_PUSH=1 E2E_SHOTS=e2e-shots/push python tools/e2e.py
      - name: Simpan tangkapan skrin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: |
            e2e-shots
            dev-server.log
          retention-days: 7
