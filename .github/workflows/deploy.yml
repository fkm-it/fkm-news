# Deploy: setiap push ke main →
#   1. CI penuh (ci.yml)
#   2. clasp push src/ + kemas kini deployment SEDIA ADA (URL /exec kekal sama)
#
# Persediaan SEKALI (lihat DEPLOYMENT.md):
#   Secret   CLASPRC_JSON   ~/.clasprc.json selepas `npx @google/clasp@3 login`
#                           MESTI akaun pemilik skrip: mohdzaki@mail.fkm.utm.my
#   Variable SCRIPT_ID      1y545hp-MSu0PFU9u1S1UIXyusHPwdDFF7od3Pd-d1g1ikv7e5YOWjsc9
#   Variable DEPLOYMENT_ID  ID deployment Web App sedia ada (AKfy…)
#   Settings → Pages → Source: GitHub Actions   (portal awam, F3)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  gas:
    name: Apps Script (clasp)
    needs: ci
    if: ${{ vars.SCRIPT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kelayakan clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Secret CLASPRC_JSON belum ditetapkan (lihat DEPLOYMENT.md)"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          # Diagnostik: struktur sahaja (nama kunci), TIADA nilai dipaparkan
          node -e '
            const fs=require("fs");const raw=fs.readFileSync(process.env.HOME+"/.clasprc.json","utf8");
            let j; try{j=JSON.parse(raw)}catch(e){console.log("::error::CLASPRC_JSON bukan JSON sah (panjang "+raw.length+", mula: "+JSON.stringify(raw.slice(0,1))+")");process.exit(1)}
            const shape=(o,d)=>o&&typeof o==="object"&&d<3?Object.fromEntries(Object.keys(o).map(k=>[k,shape(o[k],d+1)])):typeof o;
            console.log("::notice::Struktur CLASPRC_JSON: "+JSON.stringify(shape(j,0)));'
          printf '{"scriptId":"%s","rootDir":"src"}\n' "${{ vars.SCRIPT_ID }}" > .clasp.json
          npm install --no-save --no-audit --no-fund @google/clasp@3
      # Log Actions tidak boleh dibaca melalui API tanpa log masuk, jadi
      # punca kegagalan dipaparkan sebagai anotasi ::error::.
      - name: clasp push
        run: |
          set +e
          npx clasp push --force > clasp.log 2>&1
          CODE=$?
          cat clasp.log
          if [ $CODE -ne 0 ]; then
            tail -n 15 clasp.log | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done
            exit $CODE
          fi
      - name: Kemas kini deployment (URL kekal sama)
        if: ${{ vars.DEPLOYMENT_ID != '' }}
        run: |
          set +e
          npx clasp update-deployment "${{ vars.DEPLOYMENT_ID }}" --description "v$(cat VERSION) ${GITHUB_SHA::7}" > deploy.log 2>&1
          CODE=$?
          cat deploy.log
          if [ $CODE -ne 0 ]; then
            tail -n 15 deploy.log | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done
            exit $CODE
          fi
      - name: Buang kelayakan
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json

  pages:
    name: GitHub Pages (portal awam + PWA)
    needs: [ci, gas]
    if: ${{ always() && needs.ci.result == 'success' && needs.gas.result != 'failure' && vars.DEPLOYMENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bina portal
        run: node tools/build-web.js --api "https://script.google.com/macros/s/${{ vars.DEPLOYMENT_ID }}/exec" --out dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
