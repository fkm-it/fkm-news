# Portal statik (F5): StaticSite.gs menolak data/ setiap kali berita
# diterbitkan/diarkibkan → terbitkan semula GitHub Pages sahaja (tiada clasp).
name: Site data

on:
  push:
    branches: [main]
    paths: ['data/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    name: GitHub Pages (data berita terkini)
    if: ${{ vars.DEPLOYMENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bina portal
        run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          node tools/build-web.js --api "https://script.google.com/macros/s/${{ vars.DEPLOYMENT_ID }}/exec" \
            --out dist --data data --base "https://$OWNER_LC.github.io/${GITHUB_REPOSITORY#*/}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
