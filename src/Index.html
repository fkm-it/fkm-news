<!DOCTYPE html>
<html lang="ms">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FKM News</title>
  <?!= include('css'); ?>
</head>
<body>

  <div id="boot" class="boot">
    <div class="boot-mark" aria-hidden="true"></div>
    <p class="boot-text">Memuatkan sistem…</p>
  </div>

  <div id="shell" class="shell" hidden>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" id="brandMark"></div>
        <div class="brand-text">
          <span class="brand-name" id="brandName"></span>
          <span class="brand-sub" id="brandSub"></span>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="Navigasi utama"></nav>

      <div class="sidebar-foot">
        <button class="nav-item" id="collapseBtn" aria-label="Kuncupkan menu" hidden>
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/>
          </svg>
          <span class="nav-label">Kuncupkan</span>
        </button>
        <div class="who">
          <span class="who-name" id="whoName"></span>
          <span class="who-role" id="whoRole"></span>
        </div>
      </div>
    </aside>

    <div class="sidebar-scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar" id="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Buka menu">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" fill="none"/>
          </svg>
        </button>

        <h1 class="page-title" id="pageTitle"></h1>

        <div class="topbar-actions">
          <button class="cmd-trigger" id="cmdTrigger" aria-label="Buka carian pantas" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" fill="none"/>
              <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" fill="none"/>
            </svg>
            <span class="cmd-trigger-text">Cari atau lompat ke…</span>
            <span class="kbd">Ctrl K</span>
          </button>
          <button class="icon-btn" id="themeBtn" aria-label="Tukar mod paparan"
                  aria-pressed="false" hidden>
            <svg class="icon-sun" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8" fill="none"/>
              <path d="M12 2.6v2.2M12 19.2v2.2M4.2 12H2M22 12h-2.2M6.3 6.3 4.8 4.8M19.2 19.2l-1.5-1.5M17.7 6.3l1.5-1.5M4.8 19.2l1.5-1.5"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
              <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2Z"
                    stroke="currentColor" stroke-width="1.8" fill="none"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="icon-btn" id="bellBtn" aria-label="Notifikasi">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M13.7 21a2 2 0 0 1-3.4 0"
                    stroke="currentColor" stroke-width="1.8" fill="none"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="badge" id="bellBadge" hidden>0</span>
          </button>

          <div class="profile-wrap">
            <button class="profile-btn" id="profileBtn" aria-haspopup="menu" aria-expanded="false">
              <span class="avatar" id="avatar" aria-hidden="true"></span>
              <span class="profile-meta">
                <span class="profile-name" id="profileName"></span>
                <span class="profile-role" id="profileRole"></span>
              </span>
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                <path d="m6 9.5 6 6 6-6" stroke="currentColor" stroke-width="2"
                      fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="dropdown" id="profileMenu" role="menu" hidden></div>
          </div>
        </div>
      </header>

      <div class="acting-banner" id="actingBanner" role="status" hidden></div>

      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="modal-root" id="modalRoot" hidden>
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" data-close="1" aria-label="Tutup">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" fill="none"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <div class="cmd-root" id="cmdRoot" hidden>
    <div class="cmd-backdrop" data-cmd-close="1"></div>
    <div class="cmd-panel" role="dialog" aria-modal="true" aria-label="Carian pantas">
      <div class="cmd-input-wrap">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" fill="none"/>
          <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" fill="none"/>
        </svg>
        <input type="text" id="cmdInput" autocomplete="off" spellcheck="false"
               placeholder="Cari berita, atau taip nama halaman…"
               role="combobox" aria-expanded="true" aria-controls="cmdList">
      </div>
      <div class="cmd-list" id="cmdList" role="listbox"></div>
      <div class="cmd-foot">
        <span><span class="kbd">↑</span><span class="kbd">↓</span> gerak</span>
        <span><span class="kbd">Enter</span> pilih</span>
        <span><span class="kbd">Esc</span> tutup</span>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script>
    window.BOOT = { page: '<?= bootPage ?>', id: '<?= bootId ?>' };
  </script>
  <?!= include('js-core'); ?>
  <?!= include('login'); ?>
  <?!= include('portal'); ?>
  <?!= include('portal-article'); ?>
  <?!= include('dashboard'); ?>
  <?!= include('news-list'); ?>
  <?!= include('media'); ?>
  <?!= include('news-form'); ?>
  <?!= include('news-detail'); ?>
  <?!= include('review'); ?>
  <?!= include('notifications'); ?>
  <?!= include('users'); ?>
  <?!= include('social'); ?>
  <?!= include('settings'); ?>
  <?!= include('ai'); ?>
  <?!= include('bulletin'); ?>
  <script>App.start();</script>
</body>
</html>
