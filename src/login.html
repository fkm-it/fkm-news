<style>
  /* Skrin log masuk / akses ditolak. Guna token tema sedia ada. */
  .shell.is-login .sidebar,
  .shell.is-login .sidebar-scrim,
  .shell.is-login .topbar-actions,
  .shell.is-login #menuBtn { display: none !important; }
  .shell.is-login .main { margin-left: 0 !important; }
  .auth-wrap { max-width: 420px; margin: clamp(16px, 6vh, 64px) auto; }
  .auth-wrap h2 { margin: 0 0 6px; font-size: 1.15rem; }
  .auth-wrap .lead { margin: 0 0 18px; color: var(--muted-color); font-size: .86rem; line-height: 1.6; }
  .auth-wrap .code-input { font-size: 1.4rem; letter-spacing: .4em; text-align: center; }
  .auth-msg { font-size: .8rem; margin: 0 0 14px; line-height: 1.5; }
  .auth-msg.err { color: var(--danger-color); }
  .auth-msg.ok { color: var(--success-color); }
  .auth-links { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; font-size: .78rem; }
  .auth-links button { background: none; border: 0; padding: 0; color: var(--primary-color); cursor: pointer; font: inherit; }
</style>
<script>
/* login.html — skrin log masuk aplikasi staf.

   Melalui URL /exec (sesi Google): hanya mesej "akses ditolak".
   Melalui GitHub Pages (window.FKMNEWS_WEB): borang log masuk OTP e-mel.
   Kod dihantar oleh WebAuth.gs; token sesi disimpan oleh bridge. */

App.views['login'] = {

  renderDenied: function (container, message) {
    var shell = document.getElementById('shell');
    if (shell) shell.classList.add('is-login');
    document.getElementById('pageTitle').textContent = 'Log masuk';

    if (!window.FKMNEWS_WEB) {
      container.innerHTML = '<div class="auth-wrap"><section class="card card-pad">' +
        App.emptyState('Akses tidak dibenarkan',
          message || 'Akaun anda tiada akses kepada sistem ini.') +
        '</section></div>';
      return;
    }
    this.renderEmail(container, window.FKMNEWS_WEB.lastError || '');
  },

  renderEmail: function (container, notice) {
    var self = this;
    var saved = '';
    try { saved = localStorage.getItem('FKMNEWS_LAST_EMAIL') || ''; } catch (e) { }

    container.innerHTML = '<div class="auth-wrap"><section class="card card-pad">' +
      '<h2>Log masuk staf</h2>' +
      '<p class="lead">Masukkan e-mel UTM anda yang berdaftar. Kod 6 digit akan dihantar ke e-mel tersebut.</p>' +
      (notice ? '<p class="auth-msg err">' + App.esc(notice) + '</p>' : '') +
      '<form id="authEmailForm" novalidate>' +
        '<div class="field"><label for="authEmail">E-mel</label>' +
        '<input type="email" id="authEmail" autocomplete="username" inputmode="email" ' +
        'placeholder="nama@utm.my" value="' + App.esc(saved) + '" required></div>' +
        '<p class="auth-msg" id="authMsg" hidden></p>' +
        '<button class="btn btn-block" id="authSend" type="submit">Hantar kod</button>' +
      '</form></section></div>';

    var form = container.querySelector('#authEmailForm');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = container.querySelector('#authEmail').value.trim();
      var btn = container.querySelector('#authSend');
      var msg = container.querySelector('#authMsg');
      btn.disabled = true;
      btn.textContent = 'Menghantar…';
      window.FKMNEWS_WEB.request(email).then(function (res) {
        try { localStorage.setItem('FKMNEWS_LAST_EMAIL', email); } catch (e2) { }
        self.renderCode(container, email, res.message);
      }).catch(function (err) {
        msg.hidden = false;
        msg.className = 'auth-msg err';
        msg.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Hantar kod';
      });
    });
    setTimeout(function () { container.querySelector('#authEmail').focus(); }, 50);
  },

  renderCode: function (container, email, info) {
    var self = this;
    container.innerHTML = '<div class="auth-wrap"><section class="card card-pad">' +
      '<h2>Masukkan kod</h2>' +
      '<p class="lead">' + App.esc(info) + '<br><strong>' + App.esc(email) + '</strong></p>' +
      '<form id="authCodeForm" novalidate>' +
        '<div class="field"><label for="authCode">Kod 6 digit</label>' +
        '<input type="text" id="authCode" class="code-input" inputmode="numeric" ' +
        'autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required></div>' +
        '<p class="auth-msg" id="authMsg" hidden></p>' +
        '<button class="btn btn-block" id="authVerify" type="submit">Log masuk</button>' +
      '</form>' +
      '<div class="auth-links"><button type="button" id="authBack">Tukar e-mel</button>' +
      '<button type="button" id="authResend">Hantar semula kod</button></div>' +
      '</section></div>';

    var input = container.querySelector('#authCode');
    var msg = container.querySelector('#authMsg');
    var btn = container.querySelector('#authVerify');

    container.querySelector('#authCodeForm').addEventListener('submit', function (e) {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Mengesahkan…';
      window.FKMNEWS_WEB.verify(email, input.value).then(function () {
        location.reload();
      }).catch(function (err) {
        msg.hidden = false;
        msg.className = 'auth-msg err';
        msg.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Log masuk';
        input.select();
      });
    });
    input.addEventListener('input', function () {
      input.value = input.value.replace(/\D/g, '').substring(0, 6);
    });
    container.querySelector('#authBack').addEventListener('click', function () {
      self.renderEmail(container, '');
    });
    container.querySelector('#authResend').addEventListener('click', function () {
      window.FKMNEWS_WEB.request(email).then(function (res) {
        msg.hidden = false;
        msg.className = 'auth-msg ok';
        msg.textContent = res.message;
      }).catch(function (err) {
        msg.hidden = false;
        msg.className = 'auth-msg err';
        msg.textContent = err.message;
      });
    });
    setTimeout(function () { input.focus(); }, 50);
  }
};
</script>
