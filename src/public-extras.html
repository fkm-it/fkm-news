<script>
/* ==========================================================================

var PubExtras = (function () {
  'use strict';

  var WORD_BUDGET = 75;      /* ~30 saat bacaan/dengaran */
  var MAX_POINTS = 5;
  var MIN_WORDS = 6;
  var QR_BASE = 'https:' + '\/\/api.qrserver.com/v1/create-qr-code/';

  var TXT = {
    bm: {
      listen: 'Dengar', pause: 'Jeda', resume: 'Sambung', stop: 'Henti',

      card: 'Kad kongsi', cardTitle: 'Kad kongsi 1080×1080', download: 'Muat turun',
      shareImg: 'Kongsi…', cardMaking: 'Menyediakan kad…',
      cardNote: 'Sesuai untuk Instagram, Facebook dan WhatsApp Status.',

      pushTitle: 'Notifikasi & app', pushBtn: 'Notifikasi & app',

      pushOn: 'Hidupkan notifikasi', pushOff: 'Matikan notifikasi', pushActive: 'Notifikasi aktif pada peranti ini.',
      pushWorking: 'Sebentar…', pushDone: 'Notifikasi dihidupkan. Terima kasih!', pushStopped: 'Notifikasi dimatikan.',
      pushNotReady: 'Notifikasi belum dibuka oleh pentadbir.',
      iosFirst: 'Di iPhone/iPad: tekan butang Kongsi (petak dengan anak panah ke atas), pilih "Add to Home Screen", kemudian buka FKM News dari Skrin Utama dan hidupkan notifikasi di sini.',
      installTitle: 'Pasang app', installBtn: 'Pasang app FKM News', installed: 'App sudah dipasang pada peranti ini.',
      installHint: 'Buka seperti app biasa dari Skrin Utama, tanpa pelayar.',

    },
    en: {
      listen: 'Listen', pause: 'Pause', resume: 'Resume', stop: 'Stop',
      summary: '30-second summary', summaryTitle: '30-second summary',
      summaryNote: 'Automatically taken from the lead sentence of each paragraph.',
      listenSummary: 'Listen to summary', qr: 'QR code',
      qrTitle: 'Scan to read this story', qrOpen: 'Open QR image', close: 'Close',
      qrFail: 'The QR code needs an internet connection.',
      noVoice: 'No English voice on this device; the default voice is used.',
      card: 'Share card', cardTitle: 'Share card 1080×1080', download: 'Download',
      shareImg: 'Share…', cardMaking: 'Preparing card…',
      cardNote: 'Ready for Instagram, Facebook and WhatsApp Status.',
      archive: 'News archive',
      pushTitle: 'Notifications & app', pushBtn: 'Notifications & app',
      pushIntro: 'Get a notification on your phone whenever a new FKM story is published.',
      pushOn: 'Turn on notifications', pushOff: 'Turn off notifications', pushActive: 'Notifications are on for this device.',
      pushWorking: 'One moment…', pushDone: 'Notifications are on. Thank you!', pushStopped: 'Notifications turned off.',
      pushNotReady: 'Notifications have not been enabled by the administrator yet.',
      iosFirst: 'On iPhone/iPad: tap Share (the square with an up arrow), choose "Add to Home Screen", then open FKM News from your Home Screen and turn on notifications here.',
      installTitle: 'Install app', installBtn: 'Install FKM News app', installed: 'The app is installed on this device.',
      installHint: 'Opens like a normal app from your Home Screen, without the browser.',
      installManual: 'In the browser menu (⋮), choose "Install app" or "Add to Home screen".'
    }
  };

  var ICON = {
    card: '<rect x="4" y="4" width="16" height="16" rx="2.5"/><circle cx="9" cy="9.5" r="1.6"/><path d="m20 15-4.5-4.5L6 20"/>',
    listen: '<path d="M4 9.5v5h3.5L12 19V5L7.5 9.5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/>',
    pause: '<path d="M8 5v14M16 5v14"/>',
    stop: '<rect x="6" y="6" width="12" height="12" rx="1.5"/>',
    summary: '<path d="M13 3 5 13.5h6L10 21l8-10.5h-6Z"/>',
    qr: '<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/>' +
        '<rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/>'
  };

  var current = null;        /* { a, lang, root } untuk artikel yang dipaparkan */
  var observer = null;

  function pageLang() { return document.documentElement.lang === 'en' ? 'en' : 'bm'; }
  function t(key) { return (TXT[current ? current.lang : pageLang()] || TXT.bm)[key] || key; }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function icon(name) {
    return '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" ' +
      'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      ICON[name] + '</svg>';
  }

  /* ------------------------------------------------------------ Teks */

  function clean(s) { return String(s || '').replace(/\s+/g, ' ').trim(); }
  function wordCount(s) { return clean(s) ? clean(s).split(' ').length : 0; }

  /** Blok teks (perenggan, item senarai, subtajuk) daripada HTML kandungan. */
  function blocks(html) {
    var tpl = document.createElement('template');
    tpl.innerHTML = String(html || '');
    var out = [];
    tpl.content.querySelectorAll('p, li, h2, h3, h4, blockquote').forEach(function (n) {
      if (n.closest('li') && n.tagName !== 'LI') return;
      if (n.tagName === 'P' && n.closest('blockquote')) return;
      var s = clean(n.textContent);
      if (s) out.push({ tag: n.tagName, text: s });
    });
    if (!out.length) {
      var s = clean(tpl.content.textContent);
      if (s) out.push({ tag: 'P', text: s });
    }
    return out;
  }

  /** Pecah teks kepada ayat. Gelaran gaya FKM tiada titik (Prof Dr), jadi
      pemisahan pada . ! ? diikuti ruang + huruf besar/angka/petikan memadai. */
  function sentences(text) {
    var s = clean(text);
    if (!s) return [];
    var parts = s.replace(/([.!?…]["”’']?)\s+(?=[A-Z0-9"“‘(À-Ý])/g, '$1\u0001').split('\u0001');
    return parts.map(clean).filter(Boolean);
  }

  function trimWords(s, max) {
    var w = clean(s).split(' ');
    return w.length <= max ? clean(s) : w.slice(0, max).join(' ').replace(/[,;:]$/, '') + '…';
  }

  /**
   * Ringkasan 30 saat: ayat pertama setiap perenggan, mengikut susunan,
   * sehingga bajet perkataan. Ayat yang sama dengan ringkasan (lead) atau
   * terlalu pendek dilangkau.
   */
  function keyPoints(html, summary) {
    var lead = clean(summary).toLowerCase();
    var points = [], words = 0;
    blocks(html).forEach(function (b) {
      if (points.length >= MAX_POINTS || words >= WORD_BUDGET) return;
      if (b.tag !== 'P' && b.tag !== 'LI') return;
      var first = sentences(b.text)[0] || '';
      if (wordCount(first) < MIN_WORDS) return;
      first = trimWords(first, 40);
      var low = first.toLowerCase();
      if (lead && (lead.indexOf(low.replace(/…$/, '')) !== -1 || low.indexOf(lead) !== -1)) return;
      if (points.some(function (p) { return p.toLowerCase() === low; })) return;
      var n = wordCount(first);
      if (points.length >= 2 && words + n > WORD_BUDGET) return;
      points.push(first);
      words += n;
    });
    return points;
  }

  /** Teks penuh untuk dibacakan. */
  function readingText(a) {
    var parts = [a.title, a.summary].map(clean).filter(Boolean);
    blocks(a.content).forEach(function (b) { parts.push(b.text); });
    return parts.map(function (p) { return /[.!?…]$/.test(p) ? p : p + '.'; }).join(' ');
  }

  /** Cebisan ≤ 220 aksara — Chrome menghentikan utterance panjang (~15 s). */
  function chunks(text, max) {
    max = max || 220;
    var out = [], buf = '';
    sentences(text).forEach(function (s) {
      while (s.length > max) {
        var cut = s.lastIndexOf(' ', max);
        if (cut < 40) cut = max;
        if (buf) { out.push(buf); buf = ''; }
        out.push(s.slice(0, cut).trim());
        s = s.slice(cut).trim();
      }
      if (buf && (buf + ' ' + s).length > max) { out.push(buf); buf = s; }
      else buf = buf ? buf + ' ' + s : s;
    });
    if (buf) out.push(buf);
    return out;
  }

  /* ------------------------------------------------------- Pertuturan */

  var tts = { playing: false, paused: false, mode: '' };

  /* Butang Dengar DIMATIKAN (keputusan Za, 9 Okt 2026): suara pelayar
     terlalu robotik dan membaca keseluruhan berita. Kod dikekalkan; tukar
     kepada true untuk menghidupkan semula. */
  var LISTEN_ENABLED = false;

  function ttsSupported() {
    return LISTEN_ENABLED && typeof window.speechSynthesis !== 'undefined' &&
      typeof window.SpeechSynthesisUtterance !== 'undefined';
  }

  /** Pilih suara: BM → ms-* kemudian id-* (sebutan hampir sama); BI → en-GB, en-*. */
  function pickVoice(voices, lang) {
    var prefs = lang === 'en' ? ['en-gb', 'en-my', 'en'] : ['ms', 'id', 'in'];
    voices = voices || [];
    for (var i = 0; i < prefs.length; i++) {
      for (var j = 0; j < voices.length; j++) {
        var vl = String(voices[j].lang || '').toLowerCase().replace('_', '-');
        if (vl === prefs[i] || vl.indexOf(prefs[i] + '-') === 0) {
          return voices[j];
        }
      }
    }
    return null;
  }

  function speak(text, mode) {
    if (!ttsSupported()) return;
    var synth = window.speechSynthesis;
    synth.cancel();
    var voice = pickVoice(synth.getVoices(), current.lang);
    var parts = chunks(text);
    tts = { playing: true, paused: false, mode: mode };
    showVoiceNote(!voice && synth.getVoices().length > 0);
    parts.forEach(function (p, i) {
      var u = new SpeechSynthesisUtterance(p);
      u.lang = voice ? voice.lang : (current.lang === 'en' ? 'en-GB' : 'ms-MY');
      if (voice) u.voice = voice;
      u.rate = 1;
      if (i === parts.length - 1) u.onend = function () { stopSpeech(); };
      u.onerror = function (e) {
        if (e && (e.error === 'interrupted' || e.error === 'canceled')) return;
        stopSpeech();
      };
      synth.speak(u);
    });
    renderTts();
  }

  function stopSpeech() {
    if (ttsSupported()) window.speechSynthesis.cancel();
    tts = { playing: false, paused: false, mode: '' };
    renderTts();
  }

  function togglePause() {
    var synth = window.speechSynthesis;
    if (tts.paused) { synth.resume(); tts.paused = false; }
    else { synth.pause(); tts.paused = true; }
    renderTts();
  }

  function showVoiceNote(show) {
    var n = current && current.root.querySelector('[data-rt-note]');
    if (!n) return;
    n.hidden = !show;
    n.textContent = show ? t('noVoice') : '';
  }

  function renderTts() {
    if (!current) return;
    var root = current.root;
    var main = root.querySelector('[data-rt="listen"]');
    var stop = root.querySelector('[data-rt="stop"]');
    if (!main) return;
    var label = !tts.playing ? t('listen') : tts.paused ? t('resume') : t('pause');
    main.innerHTML = icon(tts.playing && !tts.paused ? 'pause' : 'listen') + '<span>' + esc(label) + '</span>';
    main.setAttribute('aria-pressed', tts.playing ? 'true' : 'false');
    if (stop) stop.hidden = !tts.playing;
  }

  /* -------------------------------------------------------------- QR */

  function qrUrl(link, size) {
    size = size || 440;
    return QR_BASE + '?size=' + size + 'x' + size + '&margin=12&ecc=M&data=' + encodeURIComponent(link);
  }

  /* ------------------------------------------------- Kad kongsi (F10) */

  var CARD = 1080;

  function loadImage(src) {
    return new Promise(function (resolve) {
      if (!/^(https:|\.)/.test(String(src || ''))) return resolve(null);
      var img = new Image();
      var timer = setTimeout(function () { resolve(null); }, 6000);
      img.crossOrigin = 'anonymous';
      img.onload = function () { clearTimeout(timer); resolve(img); };
      img.onerror = function () { clearTimeout(timer); resolve(null); };
      img.src = src;
    });
  }

  /** Bungkus teks kepada baris dalam lebar maksimum. */
  function wrapLines(ctx, text, maxWidth) {
    var words = clean(text).split(' '), lines = [], line = '';
    words.forEach(function (w) {
      var test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
      else line = test;
    });
    if (line) lines.push(line);
    return lines;
  }

  function cssVar(name, fallback) {
    try {
      var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return v || fallback;
    } catch (e) { return fallback; }
  }

  /**
   * Lukis kad 1080×1080. Gambar berita digunakan jika pelayan gambar
   * membenarkan CORS; jika tidak, kad tipografi (tanpa gambar) dilukis.
   */
  function drawCard(a, img) {
    var c = document.createElement('canvas');
    c.width = c.height = CARD;
    var x = c.getContext('2d');
    var primary = cssVar('--primary-color', '#6B1839');
    var accent = cssVar('--accent-color', '#C8952B');
    var deep = cssVar('--sidebar-to', '#3B1244');
    var font = 'Poppins, "Segoe UI", system-ui, sans-serif';
    var pad = 64;

    var g = x.createLinearGradient(0, 0, CARD, CARD);
    g.addColorStop(0, primary);
    g.addColorStop(1, deep);
    x.fillStyle = g;
    x.fillRect(0, 0, CARD, CARD);

    var top = 120;
    if (img) {
      var h = 560, r = Math.max(CARD / img.naturalWidth, h / img.naturalHeight);
      var w2 = img.naturalWidth * r, h2 = img.naturalHeight * r;
      x.drawImage(img, (CARD - w2) / 2, (h - h2) / 2, w2, h2);
      var fade = x.createLinearGradient(0, h - 260, 0, h);
      fade.addColorStop(0, 'rgba(0,0,0,0)');
      fade.addColorStop(1, primary);
      x.fillStyle = fade;
      x.fillRect(0, h - 260, CARD, 262);
      top = h + 10;
    } else {
      x.strokeStyle = accent;
      x.globalAlpha = 0.18;
      x.lineWidth = 3;
      [220, 330, 440].forEach(function (rr) { x.beginPath(); x.arc(CARD, 0, rr, 0, Math.PI * 2); x.stroke(); });
      x.globalAlpha = 1;
      x.fillStyle = accent;
      x.font = '700 30px ' + font;
      x.fillText('FKM NEWS', pad, pad + 30);
      top = 300;
    }

    /* Kategori */
    var cat = clean(a.categoryName || '').toUpperCase();
    if (cat) {
      x.font = '600 26px ' + font;
      var cw = x.measureText(cat).width + 40;
      x.fillStyle = accent;
      roundRect(x, pad, top, cw, 48, 24);
      x.fill();
      x.fillStyle = primary;
      x.fillText(cat, pad + 20, top + 33);
      top += 82;
    }

    /* Tajuk: kecilkan fon sehingga muat */
    var maxLines = img ? 4 : 6, size = img ? 58 : 72, lines;
    var bottomLimit = CARD - 170;
    do {
      x.font = '700 ' + size + 'px ' + font;
      lines = wrapLines(x, a.title || '', CARD - pad * 2);
      if (lines.length <= maxLines && top + lines.length * size * 1.2 <= bottomLimit) break;
      size -= 4;
    } while (size > 36);
    var room = Math.max(1, Math.floor((bottomLimit - top) / (size * 1.2)));
    if (lines.length > room) {
      lines = lines.slice(0, room);
      lines[room - 1] = lines[room - 1].replace(/\s+\S*$/, '') + '…';
    }
    x.fillStyle = '#FFFFFF';
    lines.forEach(function (ln, i) { x.fillText(ln, pad, top + size + i * size * 1.2); });

    /* Kaki */
    x.fillStyle = accent;
    x.fillRect(pad, CARD - 140, 96, 6);
    x.fillStyle = '#FFFFFF';
    x.font = '700 34px ' + font;
    x.fillText('FKM News', pad, CARD - 82);
    x.globalAlpha = 0.8;
    x.font = '400 24px ' + font;
    x.fillText('Fakulti Kejuruteraan Mekanikal, UTM', pad, CARD - 46);
    var date = clean(a.publishedAt || '');
    if (date) {
      x.textAlign = 'right';
      x.font = '500 26px ' + font;
      x.fillText(date, CARD - pad, CARD - 82);
      x.textAlign = 'left';
    }
    x.globalAlpha = 1;
    return c;
  }

  function roundRect(x, l, t, w, h, r) {
    x.beginPath();
    x.moveTo(l + r, t);
    x.arcTo(l + w, t, l + w, t + h, r);
    x.arcTo(l + w, t + h, l, t + h, r);
    x.arcTo(l, t + h, l, t, r);
    x.arcTo(l, t, l + w, t, r);
    x.closePath();
  }

  function toBlob(canvas) {
    return new Promise(function (resolve) {
      try { canvas.toBlob(function (b) { resolve(b); }, 'image/png'); }
      catch (e) { resolve(null); }  /* kanvas tercemar (gambar tanpa CORS) */
    });
  }

  /** Hasilkan kad; jika gambar mencemarkan kanvas, lukis semula tanpa gambar. */
  function makeCard(a) {
    var fontsReady = (document.fonts && document.fonts.load)
      ? Promise.all([document.fonts.load('700 60px Poppins'), document.fonts.load('400 24px Poppins')]).catch(function () { })
      : Promise.resolve();
    return fontsReady.then(function () { return loadImage(a.imageUrl); }).then(function (img) {
      var canvas = drawCard(a, img);
      return toBlob(canvas).then(function (blob) {
        if (blob || !img) return { canvas: canvas, blob: blob };
        var plain = drawCard(a, null);
        return toBlob(plain).then(function (b2) { return { canvas: plain, blob: b2 }; });
      });
    });
  }

  function fileName(a) {
    var base = String(a.slug || a.newsId || 'berita').toLowerCase().replace(/[^a-z0-9-]+/g, '-').slice(0, 60);
    return 'fkm-news-' + (base || 'berita') + '.png';
  }

  function openCard(btn) {
    var a = current.a;
    var label = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = t('cardMaking');
    makeCard(a).then(function (res) {
      btn.disabled = false;
      btn.innerHTML = label;
      if (!res.blob) return;
      var url = URL.createObjectURL(res.blob);
      var file = null;
      try { file = new File([res.blob], fileName(a), { type: 'image/png' }); } catch (e) { }
      var canShare = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));
      var d = dialog('cardDialog', t('cardTitle'),
        '<img class="card-preview" alt="' + esc(t('card') + ': ' + a.title) + '" src="' + url + '">' +
        '<p>' + esc(t('cardNote')) + '</p>' +
        '<div class="qr-actions">' +
          '<a class="rt-btn" data-card-dl href="' + url + '" download="' + esc(fileName(a)) + '">' + esc(t('download')) + '</a>' +
          (canShare ? '<button type="button" class="rt-btn" data-card-share>' + esc(t('shareImg')) + '</button>' : '') +
          '<button type="button" class="rt-btn" data-qr-close>' + esc(t('close')) + '</button>' +
        '</div>', function () { URL.revokeObjectURL(url); });
      var sh = d.querySelector('[data-card-share]');
      if (sh) sh.addEventListener('click', function () {
        navigator.share({ files: [file], title: a.title, text: a.title + (a.shareUrl ? ' ' + a.shareUrl : '') })
          .catch(function () { });
      });
    }).catch(function () { btn.disabled = false; btn.innerHTML = label; });
  }

  /** Dialog modal ringkas (dikongsi oleh QR dan kad). */
  function dialog(id, title, bodyHtml, onClose) {
    var old = document.getElementById(id);
    if (old) old.remove();
    var d = document.createElement('dialog');
    d.id = id;
    d.className = 'qr-dialog';
    d.setAttribute('aria-labelledby', id + 'Title');
    d.innerHTML = '<h2 id="' + id + 'Title">' + esc(title) + '</h2>' + bodyHtml;
    document.body.appendChild(d);
    var close = d.querySelector('[data-qr-close]');
    if (close) close.addEventListener('click', function () { d.close(); });
    d.addEventListener('click', function (e) { if (e.target === d) d.close(); });
    d.addEventListener('close', function () { d.remove(); if (onClose) onClose(); });
    if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
    return d;
  }

  /** Pautan "Arkib berita" di kaki portal — hanya pada binaan GitHub Pages. */
  function addArchiveLink() {
    if (!document.querySelector('link[rel="manifest"]')) return;
    var foot = document.querySelector('.pub-footer');
    if (!foot) return;
    var link = foot.querySelector('[data-archive]');
    if (!link) {
      link = document.createElement('a');
      link.setAttribute('data-archive', '');
      link.className = 'archive-link';
      link.href = 'arkib/';
      foot.appendChild(link);
    }
    link.textContent = t('archive');
  }

  function openQr() {
    var a = current.a;
    var old = document.getElementById('qrDialog');
    if (old) old.remove();
    var d = document.createElement('dialog');
    d.id = 'qrDialog';
    d.className = 'qr-dialog';
    d.setAttribute('aria-labelledby', 'qrTitle');
    d.innerHTML =
      '<h2 id="qrTitle">' + esc(t('qrTitle')) + '</h2>' +
      '<img alt="' + esc(t('qr') + ': ' + a.title) + '" src="' + esc(qrUrl(a.shareUrl)) + '">' +
      '<p>' + esc(a.shareUrl) + '</p>' +
      '<div class="qr-actions">' +
        '<a class="rt-btn" href="' + esc(qrUrl(a.shareUrl, 1000)) + '" target="_blank" rel="noopener">' +
          esc(t('qrOpen')) + '</a>' +
        '<button type="button" class="rt-btn" data-qr-close>' + esc(t('close')) + '</button>' +
      '</div>';
    document.body.appendChild(d);
    d.querySelector('img').addEventListener('error', function () {
      this.replaceWith(Object.assign(document.createElement('p'), { textContent: t('qrFail') }));
    });
    d.querySelector('[data-qr-close]').addEventListener('click', function () { d.close(); });
    d.addEventListener('click', function (e) { if (e.target === d) d.close(); });
    d.addEventListener('close', function () { d.remove(); });
    if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
  }

  /* ------------------------------------------------------- Ringkasan */

  function toggleSummary(btn) {
    var wrap = current.root.closest('.read-wrap') || document;
    var box = wrap.querySelector('.kp-box');
    if (box) {
      box.remove();
      btn.setAttribute('aria-pressed', 'false');
      if (tts.mode === 'summary') stopSpeech();
      return;
    }
    var pts = current.points;
    box = document.createElement('section');
    box.className = 'kp-box';
    box.setAttribute('aria-label', t('summaryTitle'));
    box.innerHTML = '<h2>' + esc(t('summaryTitle')) + '</h2><ul>' +
      pts.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +
      '<div class="kp-foot"><span>' + esc(t('summaryNote')) + '</span>' +
      (ttsSupported() ? '<button type="button" class="rt-btn" data-kp-listen>' + icon('listen') +
        '<span>' + esc(t('listenSummary')) + '</span></button>' : '') + '</div>';
    current.root.insertAdjacentElement('afterend', box);
    btn.setAttribute('aria-pressed', 'true');
    var l = box.querySelector('[data-kp-listen]');
    if (l) l.addEventListener('click', function () {
      speak(current.a.title + '. ' + pts.join(' '), 'summary');
    });
  }

  /* ---------------------------------------------------------- Pasang */

  /**
   * @param {Object} a    artikel daripada public.article (title, summary, content, shareUrl)
   * @param {string} lang 'bm' | 'en'
   */
  function attach(a, lang) {
    stopSpeech();
    var wrap = document.querySelector('.read-wrap');
    if (!wrap || !a) return;
    var old = wrap.querySelector('.read-tools');
    if (old) old.remove();

    var root = document.createElement('div');
    root.className = 'read-tools';
    root.setAttribute('role', 'toolbar');
    current = { a: a, lang: lang === 'en' ? 'en' : 'bm', root: root, points: keyPoints(a.content, a.summary) };
    root.setAttribute('aria-label', current.lang === 'en' ? 'Reading tools' : 'Alat pembaca');

    var html = '';
    if (ttsSupported()) {
      html += '<button type="button" class="rt-btn" data-rt="listen" aria-pressed="false"></button>' +
        '<button type="button" class="rt-btn" data-rt="stop" hidden>' + icon('stop') +
        '<span>' + esc(t('stop')) + '</span></button>';
    }
    if (current.points.length >= 2) {
      html += '<button type="button" class="rt-btn" data-rt="summary" aria-pressed="false">' +
        icon('summary') + '<span>' + esc(t('summary')) + '</span></button>';
    }
    if (typeof HTMLCanvasElement !== 'undefined') {
      html += '<button type="button" class="rt-btn" data-rt="card">' + icon('card') +
        '<span>' + esc(t('card')) + '</span></button>';
    }
    if (a.shareUrl) {
      html += '<button type="button" class="rt-btn" data-rt="qr">' + icon('qr') +
        '<span>' + esc(t('qr')) + '</span></button>';
    }
    if (!html) return;
    html += '<p class="rt-note" data-rt-note hidden></p>';
    root.innerHTML = html;

    var anchor = wrap.querySelector('.share-row') || wrap.querySelector('.read-byline');
    if (anchor) anchor.insertAdjacentElement('afterend', root);
    else wrap.insertBefore(root, wrap.firstChild);

    root.addEventListener('click', function (e) {
      var b = e.target.closest('[data-rt]');
      if (!b) return;
      var k = b.dataset.rt;
      if (k === 'listen') {
        if (!tts.playing || tts.mode !== 'full') speak(readingText(a), 'full');
        else togglePause();
      } else if (k === 'stop') stopSpeech();
      else if (k === 'summary') toggleSummary(b);
      else if (k === 'qr') openQr();
      else if (k === 'card') openCard(b);
    });
    renderTts();

    /* Henti bacaan apabila pembaca meninggalkan artikel. */
    var view = document.getElementById('view');
    if (view && !observer && typeof MutationObserver !== 'undefined') {
      observer = new MutationObserver(function () {
        if (current && !document.body.contains(current.root)) {
          stopSpeech();
          current = null;
        }
      });
      observer.observe(view, { childList: true });
    }
  }

  /* ------------------------------------------ Notifikasi & app (F11) */

  var READER_FLAG = 'FKMNEWS_PUSH_READER';
  var pushCfg = null;
  var pushSettingsLoaded = false;

  function publicCall(action, payload) {
    return new Promise(function (resolve, reject) {
      if (!window.google || !google.script || !google.script.run) return reject(new Error('Tiada sambungan.'));
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok) resolve(res.data);
          else reject(new Error((res && res.error && res.error.message) || 'Ralat pelayan.'));
        })
        .withFailureHandler(function (e) { reject(e instanceof Error ? e : new Error(String(e))); })
        .publicApi(action, payload || {});
    });
  }

  function readerOn() {
    return !!(window.FKMPush && FKMPush.store(READER_FLAG) === '1' && FKMPush.permission() === 'granted');
  }

  function bellIcon() {
    return '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M6 9.5a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4s2-1.5 2-6.5Z"/><path d="M10 19.5a2.2 2.2 0 0 0 4 0"/></svg>';
  }

  function renderPushButton() {
    var F = window.FKMPush;
    if (!F || !document.querySelector('link[rel="manifest"]')) return;
    var show = !!pushCfg || F.canInstall() || (F.isIOS && !F.standalone());
    var btn = document.getElementById('pubPush');
    if (!show) { if (btn) btn.remove(); return; }
    if (!btn) {
      var theme = document.getElementById('pubTheme');
      if (!theme) return;
      btn = document.createElement('button');
      btn.id = 'pubPush';
      btn.className = 'icon-btn';
      btn.type = 'button';
      theme.insertAdjacentElement('beforebegin', btn);
      btn.addEventListener('click', openPushDialog);
    }
    btn.setAttribute('aria-label', t('pushBtn'));
    btn.title = t('pushBtn');
    btn.innerHTML = bellIcon() + (readerOn() ? '<span class="push-dot" aria-hidden="true"></span>' : '');
  }

  function pushSectionHtml() {
    var F = window.FKMPush;
    var h = '<div class="push-sec"><h3>🔔 ' + esc(t('pushTitle').split(' & ')[0]) + '</h3>';
    if (!pushCfg) return h + '<p>' + esc(t('pushNotReady')) + '</p></div>';
    h += '<p>' + esc(t('pushIntro')) + '</p>';
    if (F.needsInstallFirst()) return h + '<p>' + esc(t('iosFirst')) + '</p></div>';
    if (readerOn()) {
      return h + '<p class="push-ok">✓ ' + esc(t('pushActive')) + '</p>' +
        '<button type="button" class="rt-btn" data-push="off">' + esc(t('pushOff')) + '</button></div>';
    }
    return h + '<button type="button" class="rt-btn" data-push="on" style="background:var(--primary-color);' +
      'border-color:var(--primary-color);color:#fff">' + esc(t('pushOn')) + '</button></div>';
  }

  function installSectionHtml() {
    var F = window.FKMPush;
    var h = '<div class="push-sec"><h3>📲 ' + esc(t('installTitle')) + '</h3>';
    if (F.standalone()) return h + '<p class="push-ok">✓ ' + esc(t('installed')) + '</p></div>';
    h += '<p>' + esc(t('installHint')) + '</p>';
    if (F.canInstall()) return h + '<button type="button" class="rt-btn" data-push="install">' + esc(t('installBtn')) + '</button></div>';
    return h + '<p>' + esc(F.isIOS ? t('iosFirst') : t('installManual')) + '</p></div>';
  }

  function openPushDialog() {
    var d = dialog('pushDialog', t('pushTitle'),
      '<div data-push-body>' + pushSectionHtml() + installSectionHtml() + '</div>' +
      '<div class="qr-actions" style="margin-top:8px"><button type="button" class="rt-btn" data-qr-close>' +
        esc(t('close')) + '</button></div>');
    var body = d.querySelector('[data-push-body]');
    function refresh() {
      body.innerHTML = pushSectionHtml() + installSectionHtml();
      renderPushButton();
    }
    body.addEventListener('click', function (e) {
      var b = e.target.closest('[data-push]');
      if (!b) return;
      var F = window.FKMPush;
      var k = b.dataset.push;
      if (k === 'install') { F.install().then(refresh); return; }
      b.disabled = true;
      b.textContent = t('pushWorking');
      var lang = pageLang();
      var job = k === 'on'
        ? F.enable(pushCfg).then(function (tok) {
            return publicCall('public.pushSubscribe', { token: tok, lang: lang, device: F.deviceLabel() });
          }).then(function () {
            F.store(READER_FLAG, '1');
            F.store('FKMNEWS_PUSH_SYNC', String(Date.now()));
            note(t('pushDone'));
          })
        : F.disable(pushCfg).then(function (tok) {
            F.store(READER_FLAG, null);
            return tok ? publicCall('public.pushUnsubscribe', { token: tok }).catch(function () { }) : null;
          }).then(function () { note(t('pushStopped')); });
      job.catch(function (err) { note(err.message || String(err), true); }).then(refresh);
    });
    function note(msg, bad) {
      var p = d.querySelector('[data-push-note]');
      if (!p) {
        p = document.createElement('p');
        p.setAttribute('data-push-note', '');
        p.setAttribute('role', 'status');
        body.insertAdjacentElement('afterend', p);
      }
      p.textContent = msg;
      p.style.color = bad ? 'var(--danger-color, #B3261E)' : 'var(--success-color, #1E7A4B)';
    }
  }

  /** Token FCM boleh bertukar; segerakkan sekali seminggu bagi pelanggan. */
  function resyncReader() {
    var F = window.FKMPush;
    if (!pushCfg || !readerOn()) return;
    var last = Number(F.store('FKMNEWS_PUSH_SYNC') || 0);
    if (Date.now() - last < 7 * 86400000) return;
    F.token(pushCfg).then(function (tok) {
      if (!tok) return;
      F.store('FKMNEWS_PUSH_SYNC', String(Date.now()));
      if (tok) {
        return publicCall('public.pushSubscribe', { token: tok, lang: pageLang(), device: F.deviceLabel() });
      }
    }).catch(function () { });
  }

  function initPush() {
    var F = window.FKMPush;
    if (!F || !document.querySelector('link[rel="manifest"]')) return;
    F.onInstallChange(renderPushButton);
    renderPushButton();
    if (pushSettingsLoaded) return;
    pushSettingsLoaded = true;
    publicCall('public.bootstrap', { lang: pageLang() }).then(function (b) {
      pushCfg = F.configFrom((b && b.settings) || {});
      renderPushButton();
      resyncReader();
    }).catch(function () { });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initPush);
  else setTimeout(initPush, 0);

  /* Pautan arkib di kaki portal; dikemas kini apabila bahasa bertukar. */
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addArchiveLink);
  else addArchiveLink();
  if (typeof MutationObserver !== 'undefined') {
    new MutationObserver(function () { addArchiveLink(); renderPushButton(); })
      .observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
  }

  /* Suara dimuat secara tak segerak dalam Chrome. */
  if (ttsSupported() && 'onvoiceschanged' in window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = function () { };
  }
  window.addEventListener('pagehide', function () { if (ttsSupported()) window.speechSynthesis.cancel(); });

  return {
    attach: attach,
    keyPoints: keyPoints,
    sentences: sentences,
    chunks: chunks,
    pickVoice: pickVoice,
    readingText: readingText,
    qrUrl: qrUrl,
    addArchiveLink: addArchiveLink
  };
})();
window.PubExtras = PubExtras;
</script>
